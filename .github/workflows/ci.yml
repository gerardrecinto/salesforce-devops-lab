name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm install --global @salesforce/cli@2.158.7
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test:lwc
      - run: npm run scan
      - run: npm run lint:project
      - run: npm run convert
      - run: npm run test:site
      - run: bash -n scripts/*.sh

  # Runs only when the repo variable SF_VALIDATE is "true" and the secrets below exist.
  # Validates the changed files against a sandbox with RunLocalTests. Nothing is deployed.
  validate:
    if: github.event_name == 'pull_request' && vars.SF_VALIDATE == 'true'
    needs: offline
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --global @salesforce/cli@2.158.7
      - name: Log in to the sandbox
        env:
          SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
        run: |
          umask 077
          printf '%s' "$SF_JWT_KEY" > "$RUNNER_TEMP/server.key"
          sf org login jwt --client-id "$SF_CLIENT_ID" --jwt-key-file "$RUNNER_TEMP/server.key" \
            --username "$SF_USERNAME" --instance-url https://test.salesforce.com --alias ci
      - run: scripts/validate-delta.sh ci origin/${{ github.base_ref }}
      - if: always()
        run: rm -f "$RUNNER_TEMP/server.key"
